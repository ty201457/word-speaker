name: Build Offline Chinese Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply offline Chinese update
        run: unzip -o offline_chinese_update.zip

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.wordspeaker --project-name word_speaker .

      - name: Validate offline dictionary asset
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          parts = sorted(Path('assets').glob('offline_dictionary.tsv.gz.part*'))
          assert len(parts) == 7
          data = gzip.decompress(b''.join(part.read_bytes() for part in parts))
          assert data.isascii()
          assert b'spot\t/' + br'\u02c8sp\u0251t/' in data
          assert br'\u4e2d' in data
          assert data.count(b'\n') >= 126000
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-speaker-offline-chinese
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
