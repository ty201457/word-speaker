name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.wordspeaker --project-name word_speaker .

      - name: Validate offline dictionary asset
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          compressed = b''.join([
              Path('assets/cmu_ipa.tsv.gz.part0').read_bytes(),
              Path('assets/cmu_ipa.tsv.gz.part1').read_bytes(),
          ])
          data = gzip.decompress(compressed)
          assert data.isascii()
          assert b'spot\t/' + br'\u02c8sp\u0251t/' in data
          assert data.count(b'\n') >= 126000
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-speaker-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
