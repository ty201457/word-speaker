name: Build Offline Chinese Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply offline Chinese update
        run: unzip -o offline_chinese_update.zip

      - name: Restore latest app source
        run: |
          git checkout HEAD -- \
            lib/main.dart \
            lib/models/dictionary_entry.dart \
            lib/services/dictionary_service.dart \
            lib/services/pronunciation_service.dart \
            test/dictionary_entry_test.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.ty201457 --project-name word_speaker .

      - name: Validate offline dictionary asset
        run: |
          python3 - <<'PY'
          import gzip
          from pathlib import Path
          parts = sorted(Path('assets').glob('offline_dictionary.tsv.gz.part*'))
          assert len(parts) == 7
          compressed = b''.join(part.read_bytes() for part in parts)
          data = gzip.decompress(compressed)
          assert data.isascii()
          assert b'spot\t/' + br'\u02c8sp\u0251t/' in data
          assert data.count(b'\n') >= 126000
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release packages
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-speaker-store-candidate
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
