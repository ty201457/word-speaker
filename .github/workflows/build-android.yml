name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.wordspeaker --project-name word_speaker .

      - name: Validate offline dictionary asset
        run: |
          test -s assets/cmu_ipa.tsv
          python3 -c "from pathlib import Path; text = Path('assets/cmu_ipa.tsv').read_text(encoding='utf-8'); assert 'spot\\t/ˈspɑt/' in text"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-speaker-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
