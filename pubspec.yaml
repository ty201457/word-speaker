name: word_speaker
description: A small cross-platform English pronunciation app.
publish_to: "none"
version: 1.2.1+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.3
  in_app_purchase: ^3.2.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/offline_dictionary.tsv.gz.part0
    - assets/offline_dictionary.tsv.gz.part1
    - assets/offline_dictionary.tsv.gz.part2
    - assets/offline_dictionary.tsv.gz.part3
    - assets/offline_dictionary.tsv.gz.part4
    - assets/offline_dictionary.tsv.gz.part5
    - assets/offline_dictionary.tsv.gz.part6
